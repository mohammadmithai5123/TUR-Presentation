<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="tur-build" content="__BUILD_ID__">
  <title>Taheri Unity Ride</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    /* Hold the deck back until the local fonts are ready so text never flashes in a fallback face. */
    (function () {
      var root = document.documentElement;
      root.classList.add('fonts-loading');
      var done = function () { root.classList.remove('fonts-loading'); };
      var timer = setTimeout(done, 3000);
      if (!document.fonts || !document.fonts.load) { clearTimeout(timer); return done(); }
      Promise.all(['700 1em Heading', '400 1em Body', '700 1em Body'].map(function (face) { return document.fonts.load(face); }))
        .then(function () { clearTimeout(timer); done(); }, function () { clearTimeout(timer); done(); });
    })();
  </script>
</head>
